<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Inventory</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f5f5f5;
        }
        h2 {
            color: #333;
        }
        .box {
            background: white;
            padding: 20px;
            margin-bottom: 30px;
            border-radius: 8px;
            width: 400px;
        }
        input {
            width: 95%;
            padding: 8px;
            margin: 5px 0;
        }
        button {
            padding: 8px 15px;
            margin-top: 10px;
            cursor: pointer;
        }
        .result {
            margin-top: 10px;
            background: #eef;
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<h1> Book Inventory</h1>

<!-- Add Book -->
<div class="box">
    <h2>Add Book</h2>
    <input id="title" placeholder="Title">
    <input id="author" placeholder="Author">
    <input id="price" placeholder="Price">

    <button onclick="addBook()">Add Book</button>

    <div id="addResult" class="result"></div>
</div>

<!-- Get Book -->
<div class="box">
    <h2>Get Book by ID</h2>
    <input id="bookId" placeholder="Book ID">

    <button onclick="getBook()">Get Book</button>

    <div id="getResult" class="result"></div>
</div>

<script>
    function addBook() {
        const book = {
            title: document.getElementById("title").value,
            author: document.getElementById("author").value,
            price: document.getElementById("price").value
        };

        fetch("/api/books", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(book)
        })
        .then(response => response.json())
        .then(data => {
            document.getElementById("addResult").innerHTML =
                `Book Added!<br>
                 ID: ${data.bookId}<br>
                 Title: ${data.title}`;
        })
        .catch(error => {
            document.getElementById("addResult").innerHTML = "Error adding book";
        });
    }

    function getBook() {
        const id = document.getElementById("bookId").value;

        fetch(`/api/books/${id}`)
        .then(response => {
            if (!response.ok) {
                throw new Error("Book not found");
            }
            return response.json();
        })
        .then(data => {
            document.getElementById("getResult").innerHTML =
                `ID: ${data.bookId}<br>
                 Title: ${data.title}<br>
                 Author: ${data.author}<br>
                 Price: ₹${data.price}`;
        })
        .catch(error => {
            document.getElementById("getResult").innerHTML = "Book not found";
        });
    }
</script>

</body>
</html>
