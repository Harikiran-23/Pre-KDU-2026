<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Books Inventory</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 40px;
        }

        h1 {
            color: #333;
        }

        .container {
            background: white;
            padding: 20px;
            width: 600px;
            border-radius: 8px;
        }

        .book {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        .book:last-child {
            border-bottom: none;
        }

        .title {
            font-weight: bold;
        }

        .price {
            color: green;
        }
    </style>
</head>
<body>

<h1> Book Inventory</h1>

<div class="container" id="bookList">
    Loading books...
</div>

<script>
    fetch("/api/books/data")
        .then(res => res.json())
        .then(data => {
            const list = document.getElementById("bookList");
            list.innerHTML = "";

            data.forEach(book => {
                const div = document.createElement("div");
                div.className = "book";

                div.innerHTML = `
                    ${book.bookId} - 
                    <span class="title">${book.title}</span>
                    by ${book.author}
                    (<span class="price">₹${book.price}</span>)
                `;

                list.appendChild(div);
            });
        });
</script>

</body>
</html>
